[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildup-learning"
version = "0.1.0"
description = "Booking list + preliminary plan feasibility checker for ULD build-up (heightmap based)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
buildup = "buildup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildup = ["data/*.json", "data/*.html"]
